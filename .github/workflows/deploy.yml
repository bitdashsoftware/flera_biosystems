name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: [ main ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Create uppercase CBD route for case-insensitive routing
        run: |
          if [ -f src/pages/cbd.astro ]; then
            cp src/pages/cbd.astro src/pages/CBD.astro
          fi
      - name: Create cased PelvicWand route for case-insensitive routing
        run: |
          if [ -f src/pages/pelvicwand.astro ]; then
            cp src/pages/pelvicwand.astro src/pages/PelvicWand.astro
          fi
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        # with:
        #   path: . # The root location of your Astro project inside the repository. (optional)
        #   node-version: 20 # The specific version of Node that should be used to build your site. (optional)
        #   package-manager: npm@latest # The Node package manager that should be used to install dependencies and build your site. (optional)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4